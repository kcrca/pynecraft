[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pynecraft"
version = "1.0.0"
dependencies = [
  "titlecase",
]

[project.optional-dependencies]
# Only needed to run pynecraft/_utils/, which regenerates the data from Minecraft's jars.
dev = [
  "requests",
]


[tool.setuptools]
packages = ["pynecraft"]

[tool.setuptools.package-data]
pynecraft = ["*.txt", "*.json"]
